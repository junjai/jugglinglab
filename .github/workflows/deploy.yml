name: Deploy Juggling Lab Web App

on:
  push:
    branches: [ main, master ]  # Triggers when you push to main/master branch
  workflow_dispatch:             # Allows you to trigger the build manually

# Grants permission to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Web Target
        run: ./gradlew wasmJsBrowserDistribution || ./gradlew jsBrowserDistribution

      # Locate the output distribution folder generated by Gradle
      - name: Locate Output Directory
        id: find-dist
        run: |
          DIST_DIR=$(find . -type d \( -path "*/build/dist/wasmJs/productionExecutable" -o -path "*/build/dist/js/productionExecutable" \) | head -n 1)
          echo "DIST_DIR=$DIST_DIR" >> $GITHUB_ENV

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DIST_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
